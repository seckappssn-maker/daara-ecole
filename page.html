   <header class="pub-hero">${hero}<div class="pub-hero-txt"><span class="pub-badge">${tyL}${D.annee&&ty!=="daara"?" · "+e(D.annee):""}</span><h1>${e(D.nom||tyL)}</h1>${D.slogan?`<p class="pub-slogan">${e(D.slogan)}</p>`:""}<div class="pub-meta">${D.ville?`<span>${PUB_IC.pin}${e(D.ville)}</span>`:""}${D.eff?`<span>${D.eff} ${ty==="daara"?P.talibes:P.eleves}</span>`:""}</div>
    ${D.inscOuv?`<a href="#pubInsc" class="pub-open">${PUB_IC.check}${P.insOuv}</a>`:""}</div></header>
   <main class="pub-main">
    ${D.pres?`<div class="pub-card"><p class="pub-pres">${e(D.pres).replace(/\n/g,"<br>")}</p>${D.resp?`<p class="pub-small">${P.resp} : <b>${e(D.resp)}</b></p>`:""}</div>`:""}
    <div class="pub-card"><h3>${P.enseigne}</h3><ul class="pub-list">${prog.map(x=>`<li>${PUB_IC.check}<span>${e(x)}</span></li>`).join("")}</ul></div>
    ${forts.length?`<div class="pub-card"><h3>${P.forts}</h3><ul class="pub-list">${forts.map(x=>`<li>${PUB_IC.check}<span>${e(x)}</span></li>`).join("")}</ul></div>`:""}
    ${prix}
    ${serv.length?`<div class="pub-card"><h3>${P.services}</h3><ul class="pub-list">${serv.map(x=>`<li>${PUB_IC.check}<span>${e(x)}</span></li>`).join("")}</ul></div>`:""}
    ${photos.length>1?`<div class="pub-card"><h3>${P.photos}</h3><div class="pub-gal">${photos.slice(1).map(p=>`<img src="${p}" alt="" loading="lazy">`).join("")}</div></div>`:""}
    ${D.horaires||D.adresse?`<div class="pub-card"><h3>${P.contact}</h3>${D.horaires?`<div class="pub-info">${PUB_IC.clock}<div><b>${P.horaires}</b><br>${e(D.horaires).replace(/\n/g,"<br>")}</div></div>`:""}${D.adresse?`<div class="pub-info">${PUB_IC.pin}<div><b>${P.adresse}</b><br>${e(D.adresse)}${D.ville?", "+e(D.ville):""}<br><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((D.adresse||"")+" "+(D.ville||"")+" Sénégal")}" target="_blank" rel="noopener">${P.itin} →</a></div></div>`:""}${waN?`<div class="pub-info"><span class="pub-num">${e(D.wa)}</span></div>`:""}</div>`:""}
    ${form}
    <button type="button" class="pub-share" data-pubshare="1">${P.partager}</button>
    <p class="pub-foot">Daara & École</p>
   </main>
   ${waN?`<div class="pub-bar">${D.inscOuv?`<a href="#pubInsc" class="pub-b1">${P.sinscrire}</a>`:""}<a href="https://wa.me/${waN}" target="_blank" rel="noopener" class="pub-b2">${P.ecrire}</a></div>`:""}
  </div>`;
}
function pubInscMessage(D,lg,f){
  const P=PS[lg]||PS.fr;const L=[];
  L.push(`${P.salam}. ${P.dem} — ${D.nom||""}`);
  L.push(`${P.enfant} : ${f.enfant||""}`);if(f.naiss)L.push(`${P.naiss} : ${f.naiss.split("-").reverse().join("/")}`);
  if(f.niveau)L.push(`${D.type==="daara"?P.regime:P.niveau} : ${f.niveau}`);
  L.push(`${P.parent} : ${f.parent||""}`);L.push(`${P.tel} : ${f.tel||""}`);if(f.quartier)L.push(`${P.quartier} : ${f.quartier}`);if(f.msg)L.push(`${P.msg.split(" (")[0]} : ${f.msg}`);
  L.push(`(${P.depuis})`);return L.join("\n");
}
function pubBind(root,getD,getLg,setLg,link){
  root.addEventListener("click",ev=>{const b=ev.target.closest("[data-plg],[data-pubshare],a[href^='#pub']");if(!b)return;
    if(b.dataset.plg){setLg(b.dataset.plg);return}
    if(b.dataset.pubshare){const D=getD();const url=link();const txt=(D.nom||"")+" — "+url;
      const done=()=>{const s=document.createElement("div");s.className="pub-toast";s.textContent=PS[getLg()].copie;document.body.appendChild(s);setTimeout(()=>s.remove(),1800)};
      if(navigator.share){navigator.share({title:D.nom||"",url}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(done,()=>{})}return}
    if(b.getAttribute("href")&&b.getAttribute("href").startsWith("#pub")){ev.preventDefault();const t=root.querySelector(b.getAttribute("href"));if(t)t.scrollIntoView({behavior:"smooth",block:"start"})}
  });
  root.addEventListener("submit",ev=>{if(ev.target.id!=="pubForm")return;ev.preventDefault();const D=getD(),lg=getLg();
    const f=Object.fromEntries(new FormData(ev.target).entries());const url="https://wa.me/"+pubPhone(D.wa)+"?text="+encodeURIComponent(pubInscMessage(D,lg,f));
    const box=root.querySelector("#pubSent");ev.target.hidden=true;box.hidden=false;box.innerHTML=`<p class="pub-note">${PS[lg].sendNote}</p><a class="pub-wa" href="${url}" target="_blank" rel="noopener">${PS[lg].ouvrirWA}</a>`;
  });
}

  let lg="fr";try{lg=localStorage.getItem("pubLg")||"fr"}catch(e){}
