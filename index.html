function addDaysI(iso,n){const[y,m,d]=iso.split("-").map(Number);const x=new Date(y,m-1,d+n);return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate())}
function diffD(a,b){const q=x=>{const[y,m,d]=x.split("-").map(Number);return Date.UTC(y,m-1,d)};return Math.round((q(b)-q(a))/86400000)}
function effToday(){const x=today();if(!S||DEMO||!S.lic)return x;const m=S.lic.maxSeen||x;const e=x>m?x:m;if(e!==S.lic.maxSeen){S.lic.maxSeen=e;writeLocal()}return e}
function licState(){if(DEMO||!S||!S.lic)return{st:"ok",left:99,end:"",trial:true};const x=effToday(),a=S.lic.trialEnd||"",b=S.lic.exp||"",end=a>b?a:b;
  if(!end)return{st:"ok",left:TRIAL_DAYS,end:"",trial:true};const left=diffD(x,end),trial=!b||a>=b;
  if(left>=0)return{st:left<=5?"warn":"ok",left,end,trial};if(-left<=GRACE_DAYS)return{st:"grace",left,end,trial};return{st:"blocked",left,end,trial}}

const actifs=()=>S.eleves.filter(x=>x.actif!==false);
function due(e,s){s=s||S;const st=s.settings;
  if(st.type==="daara")return +e.mensu||+st.mensuDef||0;
  const c=s.classes.find(z=>z.id===e.classe);
  const base=(e.mensu!==""&&e.mensu!=null&&+e.mensu>0)?+e.mensu:((c&&+c.mensu)||+st.mensuDef||0);
  return Math.max(0,base+(e.cantine?+st.cantinePrix||0:0)+(e.transport?+st.transportPrix||0:0)-(+e.reduc||0));
}
function inscDue(e){if(isD())return 0;const c=cls(e.classe);if(e.insc!==""&&e.insc!=null&&!isNaN(+e.insc))return +e.insc;return c&&c.inscription!=null&&c.inscription!==""?+c.inscription:+S.settings.inscDef||0}
const paidM=(e,m)=>S.paiements.filter(p=>p.eleve===e.id&&p.type==="mens"&&p.mois===m).reduce((a,p)=>a+(+p.montant||0),0);
const paidI=e=>S.paiements.filter(p=>p.eleve===e.id&&p.type==="insc").reduce((a,p)=>a+(+p.montant||0),0);
function schoolMonths(){const[y,m]=(S.settings.rentree||rentreeDefault()).split("-").map(Number);const out=[];for(let i=0;i<(+S.settings.nbMois||9);i++){const mm=(m-1+i)%12+1,yy=y+Math.floor((m-1+i)/12);out.push(yy+"-"+pad(mm))}return out}
function owedMonths(e){const arr=(e.arrivee||today()).slice(0,7);if(isD())return monthsBetween(arr,thisMonth());return schoolMonths().filter(m=>m<=thisMonth()&&m>=arr)}
function arrears(e){return owedMonths(e).reduce((a,m)=>a+Math.max(0,due(e)-paidM(e,m)),0)+Math.max(0,inscDue(e)-paidI(e))}
const unpaidCount=e=>owedMonths(e).filter(m=>paidM(e,m)<due(e)).length;
function status(e,m){const d=due(e),p=paidM(e,m);if(p>=d&&d>0)return["p-ok",t("paye")];if(d===0)return["p-ok","—"];if(p>0)return["p-warn",t("partiel")];return["p-bad",t("nonpaye")]}
function totals(m){
  const inM=x=>(x.date||"").startsWith(m);
  const sum=(arr,f)=>arr.filter(f).reduce((a,x)=>a+(+x.montant||0),0);
  const mens=sum(S.paiements,p=>inM(p)&&p.type==="mens"),insc=sum(S.paiements,p=>inM(p)&&p.type==="insc"),aut=sum(S.paiements,p=>inM(p)&&p.type==="autre");
  const donsA=sum(S.dons,x=>inM(x)&&x.type==="argent"),donsN=sum(S.dons,x=>inM(x)&&x.type!=="argent");
  const dep=sum(S.depenses,inM),sal=sum(S.paie,inM);
  return{mens,insc,aut,donsA,donsN,dep,sal,entr:mens+insc+aut+donsA,sort:dep+sal,solde:mens+insc+aut+donsA-dep-sal};
}
function monthDue(m,list){return list.reduce((a,e)=>a+(owedMonthsAll(e).includes(m)?due(e):0),0)}
function owedMonthsAll(e){const arr=(e.arrivee||"0000-00").slice(0,7);if(isD())return monthsBetween(arr,"9999-12").slice(0,240);return schoolMonths().filter(m=>m>=arr)}

const getNote=(per,eid,mid)=>{const v=S.notes[per]&&S.notes[per][eid]&&S.notes[per][eid][mid];return v===""||v==null?null:+v};
function avgOf(e,per,mats){let s=0,c=0;mats.forEach(mt=>{const n=getNote(per,e.id,mt.id);if(n!=null&&!isNaN(n)){s+=n*(+mt.coef||1);c+=(+mt.coef||1)}});return c?s/c:null}
function classResults(c,per){
  const list=actifs().filter(e=>e.classe===c.id);
  const fr=c.mats.filter(m=>m.part!=="ar"),ar=c.mats.filter(m=>m.part==="ar");
  const res=list.map(e=>({e,fr:avgOf(e,per,fr),ar:ar.length?avgOf(e,per,ar):null,avg:avgOf(e,per,c.mats)}));
  const ranked=res.filter(r=>r.avg!=null).sort((a,b)=>b.avg-a.avg);
  ranked.forEach((r,i)=>{r.rank=(i>0&&Math.abs(ranked[i-1].avg-r.avg)<1e-9)?ranked[i-1].rank:i+1});
  const classAvg=ranked.length?ranked.reduce((a,r)=>a+r.avg,0)/ranked.length:null;
  return{res:ranked.concat(res.filter(r=>r.avg==null)),classAvg,n:ranked.length};
}

  <div class="row" style="margin-top:12px"><button class="ghost" style="flex:1" data-copyrecu="${pid}">${t("copier")}</button><button class="ghost" style="flex:1" data-precu="${pid}">PDF</button>${e&&e.tel?`<a class="btn wa" style="flex:1" href="${wa(e.tel,txt)}" target="_blank" rel="noopener">WhatsApp</a>`:""}</div>
  <div class="row" style="margin-top:10px"><button class="ghost" style="flex:1" data-editpay="${pid}">✎</button><button class="ghost" style="flex:1" data-close="1">OK</button></div>`)}
function donForm(id){
  const d=id?S.dons.find(z=>z.id===id):{type:"argent",mode:"Wave",date:today(),affect:"Libre"};
  openSheet(`<h2>${t("dons")}</h2><form id="fDon" class="stack" data-id="${id||""}">
   ${fld("d_donateur",t("donateur"),d.donateur)}${fld("d_tel",t("telEtab"),d.tel,"tel")}
   ${sel("d_type",t("type"),[["argent",t("argent")],["nature",t("nature")]],d.type)}
   ${fld("d_nature",t("natureDesc"),d.nature)}${fld("d_montant",t("montant"),d.montant,"number")}
   <div class="grid2">${sel("d_mode",t("mode"),["",...MODES],d.mode)}${fld("d_numero",t("numero"),d.numero,"tel")}</div>
   ${sel("d_affect",t("affect"),DON_AFF.fr.map((x,i)=>[x,DON_AFF[L()][i]]),d.affect)}${fld("d_date",t("date"),d.date,"date")}
   ${formBtns}${id?delBtn("don",id):""}</form>`);
}
function depForm(id){
  const d=id?S.depenses.find(z=>z.id===id):{cat:DEP_CATS.fr[0],mode:"Espèces",date:today()};
  openSheet(`<h2>${t("depenses")}</h2><form id="fDep" class="stack" data-id="${id||""}">
   ${sel("x_cat",t("cat"),DEP_CATS.fr.map((x,i)=>[x,DEP_CATS[L()][i]]),d.cat)}${fld("x_montant",t("montant"),d.montant,"number","required")}
   <div class="grid2">${sel("x_mode",t("mode"),MODES,d.mode)}${fld("x_numero",t("numero"),d.numero,"tel")}</div>
   ${fld("x_date",t("date"),d.date,"date")}<div class="field"><label for="x_note">${t("notes")}</label><textarea id="x_note">${esc(d.note)}</textarea></div>
   ${formBtns}${id?delBtn("dep",id):""}</form>`);

function staffForm(id){
  const x=id?stf(id):{role:isD()?"Oustaz":"Enseignant(e)",salaire:0};const roles=isD()?ROLES_D:ROLES_S;
  openSheet(`<h2>${t("staff")}</h2><form id="fStaff" class="stack" data-id="${id||""}">
   ${fld("f_nom",t("nom"),x.nom,"text","required")}${sel("f_role",t("role"),roles.includes(x.role)?roles:[x.role,...roles],x.role)}
   ${fld("f_tel",t("telEtab"),x.tel,"tel")}${fld("f_sal",t("salaire"),x.salaire,"number")}
   ${formBtns}${id?delBtn("staff",id):""}</form>`);
}
function payStaffForm(sid){
  const x=stf(sid);const m=sub.mois;const p=S.paie.filter(z=>z.staff===sid&&z.mois===m).reduce((s,z)=>s+(+z.montant||0),0);
  openSheet(`<h2>${t("payer")} · ${esc(x.nom)}</h2><form id="fPaie" class="stack" data-staff="${sid}">
   ${fld("q_mois",t("mois"),m,"month")}${fld("q_montant",t("montant"),Math.max(0,(+x.salaire||0)-p),"number","required")}
   <div class="grid2">${sel("q_mode",t("mode"),MODES,"Wave")}${fld("q_numero",t("numero"),x.tel,"tel")}</div>${fld("q_date",t("date"),today(),"date")}
   ${formBtns}</form>`);

function matRows(){const fa=isFA();return tmpMats.map((m,i)=>`<div class="matrow ${fa?"fa":""}"><input id="mn_${i}" value="${esc(m.nom)}" aria-label="${t("matiere")}"><input id="mc_${i}" type="number" inputmode="decimal" min="0" value="${esc(m.coef)}" aria-label="${t("coef")}">${fa?`<select id="mp_${i}" aria-label="part"><option value="fr" ${m.part!=="ar"?"selected":""}>FR</option><option value="ar" ${m.part==="ar"?"selected":""}>AR</option></select>`:""}<button type="button" class="danger sm" data-matdel="${i}" aria-label="${t("del")}">✕</button></div>`).join("")}
function readMats(){if(!tmpMats)return;tmpMats=tmpMats.map((m,i)=>({id:m.id,nom:v("mn_"+i)||m.nom,coef:+v("mc_"+i)||1,part:isFA()?(v("mp_"+i)||m.part):"fr"}))}

  const c=id?cls(id):{niveau:"CI",nom:"",bareme:10,mensu:S.settings.mensuDef,inscription:S.settings.inscDef,maitre:"",maitreAr:"",mats:defMats("CI",isFA())};
  tmpMats=c.mats.map(m=>({...m}));const so=[["","—"],...S.staff.map(x=>[x.id,x.nom])];

function ph(title,lg){lg=lg||"fr";const s=S.settings;return `<div class="ph"><div><b>${esc(s.nom||"")}</b><br>${esc([s.resp,s.ville].filter(Boolean).join(" – "))}${s.tel?"<br>"+pt(lg,"tel")+" : "+esc(s.tel):""}</div><div>${isD()?"":pt(lg,"annee")+" "+anneeLabel()+"<br>"}${pt(lg,"edite")} ${dateL(today(),lg)}</div></div>${title?`<div class="pt">${title}</div>`:""}`}
let langCb=null;
function askLang(def,cb,withEach){if(isEc()){cb("fr");return}langCb=cb;
  openSheet(`<h2>${t("langDoc")}</h2><p class="muted small">${t("langDocS")}</p><div class="stack">${withEach?`<button data-plang="each">${t("langEach")}</button>`:""}${[["fr","Français"],["wo","Wolof"],["ar","العربية"]].map(([k,l])=>`<button class="${k===def&&!withEach?"":"ghost"}" data-plang="${k}" ${k==="ar"?'lang="ar" style="font-family:var(--f-ar);font-size:1.15em"':""}>${l}${k===def&&!withEach?" ✓":""}</button>`).join("")}<button class="ghost" data-close="1">${t("cancel")}</button></div>`)}
let pdfTold=false;
function doPrint(html){$("#print").innerHTML=html;try{window.print()}catch(e){}if(!pdfTold){pdfTold=true;setTimeout(()=>toast(t("pdfInfo")),400)}}
function pBulletin(e,per,lg){lg=lg||"fr";const c=cls(e.classe);const P=k=>pt(lg,k);return `<div class="pg">${ph(P("bullT")+" — "+perLabel(per,lg),lg)}<div class="kv"><span>${isD()?P("tal"):P("elv")}</span><span><b>${esc(e.nom)}</b></span><span>${P("classe")}</span><span>${esc(c.nom)}</span><span>${P("matricule")}</span><span>${esc(e.matricule||"—")}</span><span>${P("neLe")}</span><span>${dateL(e.naiss,lg)||"—"}</span><span>${P("maitreCl")}</span><span>${esc((stf(c.maitre)||{}).nom||"—")}${isFA()&&c.maitreAr?" / "+esc((stf(c.maitreAr)||{}).nom||""):""}</span></div>${bulletinInner(e,per,true,lg)}<div class="sig"><div>${P("sigD")}</div><div>${P("parent")}</div></div></div>`}
function pFiche(e,lg){lg=lg||"fr";const P=k=>pt(lg,k);
  const s=S.settings,c=e?cls(e.classe):null,blankF=!e;const L_=(k,v)=>`<span>${P(k)}</span><span>${blankF?"…………………………………":esc(v||"—")}</span>`;
  const frais=isD()?L_("mensu",e?F(due(e)):""):L_("fraisI",e?F(inscDue(e)):"")+L_("mensu",e?F(due(e)):"")+(isEc()?`<span>Cantine</span><span>${blankF?"……………":e.cantine?"Oui (+"+F(s.cantinePrix)+")":"Non"}</span><span>Transport</span><span>${blankF?"……………":e.transport?"Oui (+"+F(s.transportPrix)+")":"Non"}</span>`:"");
  return `<div class="pg">${ph(isD()?P("ficheTD"):P("ficheT"),lg)}
   <div class="kv">${L_("nom",e&&e.nom)}${L_("sexe",e&&(e.sexe==="F"?P("F"):P("G")))}${L_("naiss",e&&dateL(e.naiss,lg))}
   ${isD()?L_("regime",e&&(e.regime==="interne"?P("int"):P("ext")))+L_("maitre",e&&(stf(e.maitre)||{}).nom):L_("classe",c&&c.nom)+L_("matricule",e&&e.matricule)}
   ${L_("arrivee",e&&dateL(e.arrivee,lg))}${L_("parentT",e&&e.parent)}${L_("telP",e&&[e.tel,e.tel2].filter(Boolean).join(" / "))}${L_("adr",e&&e.adresse)}${frais}
   <span>${P("paiement")}</span><span>${esc(payText()||P("especes"))}</span></div>
   <div class="pt" style="font-size:11pt">${P("regl")}</div><div class="regl">${esc(regFor(lg))}</div>
   <p>${P("decl")}</p><p>${P("faitA")} ${esc((s.ville||"").split(",")[0]||"……………")}, ${P("le")} ${blankF?"……………":dateL(today(),lg)}</p>
   <div class="sig"><div>${P("sigP")}</div><div>${isD()?P("sigS"):P("sigD")}</div></div></div>`;
}
function pListe(){const a=actifs().sort((x,y)=>x.nom.localeCompare(y.nom));
  const grp=isD()?[["interne","Internes"],["externe","Externes"]].map(([k,l])=>[l,a.filter(e=>e.regime===k)]):S.classes.map(c=>[c.nom,a.filter(e=>e.classe===c.id)]).concat([["Sans classe",a.filter(e=>!cls(e.classe))]]);
  return `<div class="pg">${ph(isD()?"Liste des talibés":"Liste des élèves")}${grp.filter(g=>g[1].length).map(([l,list])=>`<b>${esc(l)} (${list.length})</b><table class="ptbl"><thead><tr><th>#</th><th>Nom</th><th>Sexe</th><th>Naissance</th><th>Parent</th><th>Téléphone</th>${isD()||isFA()?"<th>Hizb</th>":""}</tr></thead><tbody>${list.map((e,i)=>`<tr><td>${i+1}</td><td>${esc(e.nom)}</td><td>${e.sexe==="F"?"F":"G"}</td><td>${dateLabel(e.naiss)}</td><td>${esc(e.parent||"")}</td><td>${esc(e.tel||"")}</td>${isD()||isFA()?`<td>${+e.hizb||0}/60</td>`:""}</tr>`).join("")}</tbody></table>`).join("")}</div>`}
function pEtat(m){const a=actifs().sort((x,y)=>x.nom.localeCompare(y.nom));let td=0,tp=0,ta=0;
  const rows=a.map(e=>{const d=owedMonthsAll(e).includes(m)?due(e):0,p=paidM(e,m),ar=arrears(e);td+=d;tp+=p;ta+=ar;return `<tr><td>${esc(e.nom)}</td><td>${esc(isD()?(e.regime==="interne"?"Interne":"Externe"):((cls(e.classe)||{}).nom||""))}</td><td class="r">${F(d)}</td><td class="r">${F(p)}</td><td class="r">${F(Math.max(0,d-p))}</td><td class="r">${F(ar)}</td></tr>`}).join("");
  return `<div class="pg">${ph("État des paiements — "+moisLabel(m,"fr"))}<table class="ptbl"><thead><tr><th>Nom</th><th>${isD()?"Régime":"Classe"}</th><th>Dû</th><th>Payé</th><th>Reste du mois</th><th>Total en retard</th></tr></thead><tbody>${rows}<tr><th colspan="2">Total</th><th class="r">${F(td)}</th><th class="r">${F(tp)}</th><th class="r">${F(Math.max(0,td-tp))}</th><th class="r">${F(ta)}</th></tr></tbody></table></div>`}
function pBilan(m){const T_=totals(m);
  const deps=S.depenses.filter(d=>(d.date||"").startsWith(m)),dons=S.dons.filter(d=>(d.date||"").startsWith(m)),paie=S.paie.filter(p=>(p.date||"").startsWith(m));
  return `<div class="pg">${ph("Bilan du mois — "+moisLabel(m,"fr"))}<table class="ptbl"><tbody>
   <tr><td>Mensualités</td><td class="r">${F(T_.mens)}</td></tr>${isD()?"":`<tr><td>Inscriptions</td><td class="r">${F(T_.insc)}</td></tr>`}<tr><td>Autres paiements</td><td class="r">${F(T_.aut)}</td></tr>${isEc()?"":`<tr><td>Dons en argent</td><td class="r">${F(T_.donsA)}</td></tr>`}
   <tr><th>Total entrées</th><th class="r">${F(T_.entr)}</th></tr><tr><td>Dépenses</td><td class="r">− ${F(T_.dep)}</td></tr><tr><td>Salaires</td><td class="r">− ${F(T_.sal)}</td></tr>
   <tr><th>Solde du mois</th><th class="r">${F(T_.solde)}</th></tr></tbody></table>
   ${deps.length?`<b>Dépenses</b><table class="ptbl"><thead><tr><th>Date</th><th>Catégorie</th><th>Note</th><th>Mode</th><th>Montant</th></tr></thead><tbody>${deps.map(d=>`<tr><td>${dateLabel(d.date)}</td><td>${esc(d.cat)}</td><td>${esc(d.note||"")}</td><td>${esc(d.mode||"")} ${esc(d.numero||"")}</td><td class="r">${F(d.montant)}</td></tr>`).join("")}</tbody></table>`:""}
   ${paie.length?`<b>Salaires payés</b><table class="ptbl"><thead><tr><th>Date</th><th>Nom</th><th>Mode</th><th>Montant</th></tr></thead><tbody>${paie.map(p=>`<tr><td>${dateLabel(p.date)}</td><td>${esc((stf(p.staff)||{}).nom||"")}</td><td>${esc(p.mode)} ${esc(p.numero||"")}</td><td class="r">${F(p.montant)}</td></tr>`).join("")}</tbody></table>`:""}
   ${dons.length?`<b>Dons</b><table class="ptbl"><thead><tr><th>Date</th><th>Donateur</th><th>Détail</th><th>Utilisation</th><th>Montant</th></tr></thead><tbody>${dons.map(d=>`<tr><td>${dateLabel(d.date)}</td><td>${esc(d.donateur||"Anonyme")}</td><td>${esc(d.type==="argent"?(d.mode||"")+" "+(d.numero||""):d.nature)}</td><td>${esc(d.affect||"")}</td><td class="r">${d.type==="argent"?"":"≈ "}${F(d.montant)}</td></tr>`).join("")}</tbody></table>`:""}
   <div class="sig"><div>Le responsable</div><div>Le trésorier</div></div></div>`}
function bilanText(){const m=sub.mois,T_=totals(m),s=S.settings;
  return `${s.nom} — Bilan ${moisLabel(m,"fr")}\nMensualités : ${F(T_.mens)}${isD()?"":"\nInscriptions : "+F(T_.insc)}${T_.aut?"\nAutres : "+F(T_.aut):""}${isEc()?"":"\nDons : "+F(T_.donsA)}\nDépenses : ${F(T_.dep)}\nSalaires : ${F(T_.sal)}\nSolde : ${F(T_.solde)}\n${isD()?"Talibés":"Élèves"} : ${actifs().length}`}

function pubInscMessage(D,lg,f){

  if(f.niveau)L.push(`${D.type==="daara"?P.regime:P.niveau} : ${f.niveau}`);
  L.push(`${P.parent} : ${f.parent||""}`);L.push(`${P.tel} : ${f.tel||""}`);if(f.quartier)L.push(`${P.quartier} : ${f.quartier}`);if(f.msg)L.push(`${P.msg.split(" (")[0]} : ${f.msg}`);

    if(b.dataset.plg){setLg(b.dataset.plg);return}

      const done=()=>{const s=document.createElement("div");s.className="pub-toast";s.textContent=PS[getLg()].copie;document.body.appendChild(s);setTimeout(()=>s.remove(),1800)};
      if(navigator.share){navigator.share({title:D.nom||"",url}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(done,()=>{})}return}

  if(d.pay){payForm(d.pay,d.ptype);return}
  if(d.recu){recuSheet(d.recu);return}
  if(d.editpay){const p=S.paiements.find(z=>z.id===d.editpay);payForm(p.eleve,p.type,p.id);return}
  if(d.copyrecu){copy(recuText(S.paiements.find(z=>z.id===d.copyrecu)));return}
  if(d.plang){const cb=langCb;langCb=null;closeSheet();if(cb)cb(d.plang);return}
  if(d.precu){const p=S.paiements.find(z=>z.id===d.precu);askLang(parentLang(el(p.eleve)),lg=>doPrint(wrapLg(lg,`<div class="recuP">${esc(recuText(p,lg))}</div>`)));return}
  if(d.pfiche){const x=el(d.pfiche);askLang(parentLang(x),lg=>doPrint(wrapLg(lg,pFiche(x,lg))));return}
  if(d.pbull){const x=el(d.pbull);askLang(parentLang(x),lg=>doPrint(wrapLg(lg,pBulletin(x,sub.nPer,lg))));return}
  if(d.bull){bulletinSheet(d.bull);return}
  if(d.don){donForm(d.don);return}
  if(d.dep){depForm(d.dep);return}
  if(d.staff){staffForm(d.staff);return}
  if(d.paystaff){payStaffForm(d.paystaff);return}
  if(d.cls){clsForm(d.cls);return}
  if(d.doc){const m=sub.mois;if(d.doc==="vierge"){askLang("fr",lg=>doPrint(wrapLg(lg,pFiche(null,lg))));return}const H={liste:pListe(),etat:pEtat(m),bilan:pBilan(m)};doPrint(d.doc==="tout"?H.liste+H.etat+H.bilan:H[d.doc]);return}
  if(d.jdone){const j=S.journal.find(z=>z.id===d.jdone);if(j)j.todo=false;save();if(d.back)elFiche(d.back);else render();toast(t("saved"));return}
  if(d.matdel!==undefined){readMats();tmpMats.splice(+d.matdel,1);$("#matBox").innerHTML=matRows();return}
  if(d.settype){if(pendingDel!=="type"+d.settype){pendingDel="type"+d.settype;b.textContent=t("confirmDel");return}pendingDel=null;S.settings.type=d.settype;if(!S.settings.reglement||Object.values(REG).includes(S.settings.reglement))S.settings.reglement=REG[d.settype];["wo","ar"].forEach(l=>{const k=l==="wo"?"reglementWo":"reglementAr";if(!S.settings[k]||Object.values(REGL[l]).includes(S.settings[k]))S.settings[k]=""});save();view="home";sub.more="";render();toast(t("saved"));return}
  if(d.pres){const day=sub.presDate;S.presences[day]=S.presences[day]||{};if(S.presences[day][d.pres]===d.v)delete S.presences[day][d.pres];else S.presences[day][d.pres]=d.v;save();render();return}
  if(d.del){
    const k=d.del+":"+d.id;if(pendingDel!==k){pendingDel=k;b.textContent=t("confirmDel");return}
    pendingDel=null;
    if(d.del==="el"){const x=el(d.id);if(x)x.actif=false}
    if(d.del==="pay")S.paiements=S.paiements.filter(z=>z.id!==d.id);
    if(d.del==="don")S.dons=S.dons.filter(z=>z.id!==d.id);
    if(d.del==="dep")S.depenses=S.depenses.filter(z=>z.id!==d.id);
    if(d.del==="staff")S.staff=S.staff.filter(z=>z.id!==d.id);
    if(d.del==="cls"){S.classes=S.classes.filter(z=>z.id!==d.id);S.eleves.forEach(x=>{if(x.classe===d.id)x.classe=""})}
    save();closeSheet();render();toast(t("deleted"));return}
  switch(d.act){
    case"newEl":if(!isD()&&!S.classes.length){toast(t("noClass"))}elForm();break;
    case"newDon":donForm();break;case"newDep":depForm();break;case"newStaff":staffForm();break;case"newCls":clsForm();break;
    case"matAdd":readMats();tmpMats.push({id:uid(),nom:"",coef:1,part:"fr"});$("#matBox").innerHTML=matRows();break;
    case"matDef":tmpMats=defMats(v("c_niv"),isFA());$("#matBox").innerHTML=matRows();const bs=document.getElementById("c_bar");if(bs)bs.value=barFor(v("c_niv"));break;
    case"allPresent":{const day=sub.presDate;S.presences[day]=S.presences[day]||{};let a=actifs();if(!isD()&&sub.presCls)a=a.filter(x=>x.classe===sub.presCls);a.forEach(x=>{if(!S.presences[day][x.id])S.presences[day][x.id]="P"});save();render();break}
    case"pdfClasse":{const c=cls(sub.nCls);const list=classResults(c,sub.nPer).res.map(r=>r.e);askLang("fr",lg=>doPrint(list.map(e=>{const l=lg==="each"?parentLang(e):lg;return wrapLg(l,pBulletin(e,sub.nPer,l))}).join("")),true);break}
    case"clearDemo":{const st=S.settings,kl=S.lic,ku=S.uid;S=blank(st.type,st.lang);S.lic=kl||S.lic;S.uid=ku;S.settings.nom=st.nom;S.settings.big=st.big;save();view="more";sub.more="params";render();toast(t("saved"));break}
    case"pgView":openPubPreview();break;
    case"authMode":AUTH_MODE=d.m;render();break;
    case"demo":DEMO=true;S=null;view="home";render();scrollTo(0,0);break;
    case"quitDemo":DEMO=false;S=SB?null:readLocal();view="home";closeSheet();render();scrollTo(0,0);break;
    case"chkSub":(async()=>{if(!SB||!USER)return toast(t("errNet"));b.disabled=true;try{await fetchLic();render();const Lc=licState();toast(Lc.st==="blocked"||Lc.st==="grace"?t("payNotYet"):(Lc.trial?t("essai"):t("abonne"))+" "+t("jusqu")+" "+dateLabel(Lc.end))}catch(x){b.disabled=false;toast(t("errNet"))}})();break;
    case"chgPass":(async()=>{const np=(document.getElementById("newPass")||{}).value||"";if(np.length<6)return toast(t("errPass"));const r=await SB.auth.updateUser({password:np});if(r.error)return toast(t("errNet"));toast(t("passChanged"))})();break;
    case"askLogout":{const z=document.getElementById("outZone");if(z)z.innerHTML=`<div class="demo" style="background:var(--bad-soft);color:var(--bad)"><span style="flex:1">${t("logoutQ")}</span><div class="row"><button class="sm danger" data-act="logout">${t("oui")}</button><button class="sm ghost" data-act="noOut">${t("non")}</button></div></div>`;break}
    case"logout":doLogout();break;
    case"noOut":render();break;
    case"pgCopy":copy(pubLink());break;
    case"copyBilan":copy(bilanText());break;case"copyV":copy(VENDEUR);break;
    case"copyGroup":copy(fillTpl(sub.msgTpl,null,v("msgTxt")).replace(/^(Assalamou alaykoum|السلام عليكم) *\./,"$1."));break;
    case"exportT":copy(JSON.stringify(S));break;
    case"exportF":{try{const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="daara-ecole-sauvegarde-"+today()+".json";document.body.appendChild(a);a.click();a.remove()}catch(_){copy(JSON.stringify(S))}break}
    case"import":{try{let o=JSON.parse(v("imp"));if(o.talibes&&!o.eleves)o=migrate(o);if(!o.settings||!Array.isArray(o.eleves))throw 0;const keepLic=S.lic,keepUid=S.uid;S=fixS(o);S.lic=keepLic;S.uid=keepUid;save();view="home";render();toast(t("saved"))}catch(_){toast("Sauvegarde invalide")}break}
  }
});
document.addEventListener("input",e=>{
  const x=e.target;
  if(x.id==="q"){sub.q=x.value;const pos=x.selectionStart;render();const q=$("#q");q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}
  if(x.dataset&&x.dataset.note){const val=x.value.trim();const c=cls(sub.nCls);S.notes[sub.nPer]=S.notes[sub.nPer]||{};S.notes[sub.nPer][x.dataset.note]=S.notes[sub.nPer][x.dataset.note]||{};
    if(val===""){delete S.notes[sub.nPer][x.dataset.note][sub.nMat]}else{let n=+val.replace(",",".");if(isNaN(n))return;n=Math.max(0,Math.min(c.bareme,n));S.notes[sub.nPer][x.dataset.note][sub.nMat]=n}save()}
  if(x.id==="msgTxt"){const txt=x.value;sub.msgTxt=txt;document.querySelectorAll("#msgList a[data-sent]").forEach(a=>{const st=el(a.dataset.sent);if(st)a.href=wa(st.tel,fillTpl(sub.msgTpl,st,txt))})}
});
document.addEventListener("change",e=>{
  const x=e.target,id=x.id;
  const R={presDate:()=>sub.presDate=x.value||today(),presCls:()=>sub.presCls=x.value,mois:()=>sub.mois=x.value||thisMonth(),fCls:()=>sub.cls=x.value,moneyCls:()=>sub.moneyCls=x.value,
    nCls:()=>{sub.nCls=x.value;sub.nMat=""},nPer:()=>sub.nPer=x.value,nMat:()=>sub.nMat=x.value,msgTpl:()=>{sub.msgTpl=x.value;sub.msgTxt=null},msgTo:()=>sub.msgTo=x.value};
  if(R[id]){R[id]();render();return}
  if(id==="c_niv"){const f=$("#fCls");if(f&&!f.dataset.id){tmpMats=defMats(x.value,isFA());$("#matBox").innerHTML=matRows();const bs=$("#c_bar");if(bs)bs.value=barFor(x.value);const n=$("#c_nom");if(n&&!n.dataset.touched)n.value=(NIV.find(z=>z[0]===x.value)||[])[1]||""}}
  if(id==="c_nom")x.dataset.touched="1";
  if(id==="pg_ph"&&x.files&&x.files.length){if(licState().st==="blocked")return toast(t("bloque"));readPage();const ph=PHOTOS;const files=[...x.files].slice(0,6-ph.length);
    Promise.all(files.map(f=>shrinkImage(f,900,0.68).catch(()=>null))).then(list=>{list.filter(Boolean).forEach(d=>ph.push(d));photosChanged();save();render();toast(t("saved"))});}
  if(x.dataset&&x.dataset.note){const c=cls(sub.nCls);const n=+x.value.replace(",",".");if(!isNaN(n)&&x.value!=="")x.value=Math.max(0,Math.min(c.bareme,n))}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="fEl"){
    const o={nom:v("e_nom"),sexe:v("e_sexe"),naiss:v("e_naiss"),parent:v("e_parent"),tel:v("e_tel"),tel2:v("e_tel2"),adresse:v("e_adr"),arrivee:v("e_arr")||today(),notes:v("e_notes")};
    if(!o.nom)return;
    if(isD()){Object.assign(o,{regime:v("e_regime"),maitre:v("e_maitre"),mensu:+v("e_mensu")||0})}
    else Object.assign(o,{classe:v("e_classe"),matricule:v("e_mat"),mensu:v("e_mensu"),insc:v("e_insc"),reduc:+v("e_reduc")||0,cantine:ck("e_cant"),transport:ck("e_trans")});
    if(!isEc())o.langue=v("e_lang")||"fr";
    if(isD()||isFA()){o.hizb=Math.min(60,Math.max(0,+v("e_hizb")||0));o.sourate=v("e_sour");o.khatm=ck("e_khatm")||o.hizb>=60}
    let id=f.dataset.id;
    if(id)Object.assign(el(id),o);else{id=uid();if(!isD()&&!o.matricule)o.matricule=anneeLabel().slice(0,4)+"-"+pad(S.eleves.length+1)+"0";S.eleves.push({id,actif:true,...o})}
    save();render();elFiche(id);toast(t("saved"));return;
  }
  if(f.id==="fPay"){
    const o={eleve:f.dataset.el,type:v("p_type")||"mens",mois:v("p_mois")||thisMonth(),montant:+v("p_montant")||0,mode:v("p_mode"),numero:v("p_numero"),date:v("p_date")||today(),note:v("p_note")};
    if(o.type!=="mens")o.mois="";if(!o.montant)return;
    let id=f.dataset.id;if(id)Object.assign(S.paiements.find(z=>z.id===id),o);else{id=uid();S.paiements.push({id,...o})}
    save();render();recuSheet(id);toast(t("saved"));return;
  }
  if(f.id==="fJr"){const txt=v("j_txt");if(!txt)return;S.journal.push({id:uid(),eleve:f.dataset.el,date:today(),qui:v("j_qui"),texte:txt,todo:ck("j_todo")});save();elFiche(f.dataset.el);toast(t("saved"));return}
  if(f.id==="fDon"){const o={donateur:v("d_donateur"),tel:v("d_tel"),type:v("d_type"),nature:v("d_nature"),montant:+v("d_montant")||0,mode:v("d_mode"),numero:v("d_numero"),affect:v("d_affect"),date:v("d_date")||today()};
    if(f.dataset.id)Object.assign(S.dons.find(z=>z.id===f.dataset.id),o);else S.dons.push({id:uid(),...o})}
  if(f.id==="fDep"){const o={cat:v("x_cat"),montant:+v("x_montant")||0,mode:v("x_mode"),numero:v("x_numero"),date:v("x_date")||today(),note:v("x_note")};if(!o.montant)return;
    if(f.dataset.id)Object.assign(S.depenses.find(z=>z.id===f.dataset.id),o);else S.depenses.push({id:uid(),...o})}
  if(f.id==="fStaff"){const o={nom:v("f_nom"),role:v("f_role"),tel:v("f_tel"),salaire:+v("f_sal")||0};if(!o.nom)return;
    if(f.dataset.id)Object.assign(stf(f.dataset.id),o);else S.staff.push({id:uid(),...o})}
  if(f.id==="fPaie"){const o={staff:f.dataset.staff,mois:v("q_mois")||thisMonth(),montant:+v("q_montant")||0,mode:v("q_mode"),numero:v("q_numero"),date:v("q_date")||today()};if(!o.montant)return;S.paie.push({id:uid(),...o})}
  if(f.id==="fCls"){readMats();const niv=v("c_niv");const o={niveau:niv,nom:v("c_nom")||(NIV.find(z=>z[0]===niv)||[])[1]||niv,bareme:+v("c_bar")||10,mensu:+v("c_mensu")||0,inscription:+v("c_insc")||0,maitre:v("c_mai"),maitreAr:v("c_maiAr"),mats:tmpMats.filter(m=>m.nom)};
    if(f.dataset.id)Object.assign(cls(f.dataset.id),o);else S.classes.push({id:uid(),...o})}
  if(f.id==="fAuth"){doAuth();return}
  if(f.id==="fPage"){readPage();save();render();toast(t("saved"));return}
  if(f.id==="fSet"){const s=S.settings;Object.assign(s,{nom:v("s_nom"),resp:v("s_resp"),ville:v("s_ville"),tel:v("s_tel"),wave:v("s_wave"),om:v("s_om"),mensuDef:+v("s_mensu")||0,reglement:v("s_reg"),big:ck("s_big")});
    if(!isEc()){s.reglementWo=v("s_regWo");s.reglementAr=v("s_regAr")}
    if(!isD()){Object.assign(s,{inscDef:+v("s_insc")||0,rentree:v("s_rentree")||s.rentree,nbMois:Math.min(12,Math.max(1,+v("s_nbm")||9)),periode:v("s_per")||"trim"});if(isEc())Object.assign(s,{cantinePrix:+v("s_cant")||0,transportPrix:+v("s_trans")||0})}}
  save();closeSheet();render();toast(t("saved"));
});
render();boot();
})();
</script>

</body>
